<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>أحمد — متابعة الحجوزات</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:20px;background:#f5f7fb;color:#15213a}input,button{padding:12px;margin:6px;border-radius:8px;border:1px solid #ccd3df}article{background:white;padding:20px;margin:16px 0;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metrics article{margin:0;border-top:3px solid #168a86}h2{font-size:1.15rem}button{cursor:pointer;background:#e4f5f3}button:focus,input:focus{outline:3px solid #66aba7}#error{color:#a20c24}</style><h1>أحمد — لوحة المتابعة</h1><p>للموظفين المخولين فقط. مفتاح الإدارة يبقى في ذاكرة الصفحة ولا يُحفظ في المتصفح.</p><input id="key" type="password" autocomplete="off" placeholder="مفتاح الإدارة"><button id="load">عرض حالة الخدمة وطلبات التثبيت</button><p id="error"></p><section id="status" aria-live="polite"></section><section id="jobs"></section><script src="/operations.js" defer></script></html>
