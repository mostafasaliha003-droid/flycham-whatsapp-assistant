<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>فاوجرات مجموعة الرمال</title><style>body{font-family:system-ui;background:#eef4f4;color:#102632;max-width:1000px;margin:30px auto;padding:20px}section{background:white;border-radius:18px;padding:22px;margin:18px 0}input,select,button{font:inherit;padding:12px;border:1px solid #b6caca;border-radius:8px;margin:6px;max-width:90%}button{background:#173c47;color:white;cursor:pointer}label{display:block}#message{white-space:pre-wrap}img{width:100%;border-radius:14px}small{display:block;color:#49616a}.danger{background:#a9283b}</style><h1>فاوجرات مجموعة الرمال</h1><p>تُصدر لحجوزات فلاي شام المؤكدة فقط. الاستخدام لاحقًا على خدمات مجموعة الرمال.</p><label>مفتاح الإدارة <input id="key" type="password" autocomplete="off"></label><button id="check">التحقق من جاهزية الخدمة</button><p id="message" role="status"></p><section><h2>إصدار فاوجر بعد إتمام الحجز</h2><label>اسم العميل <input id="name" maxlength="80"></label><label>مرجع الحجز <input id="booking" maxlength="40"></label><label>مرجع المسافر أو التذكرة داخل الحجز <input id="passenger" maxlength="40" placeholder="P1"></label><label>نوع الرحلة <select id="trip"><option value="one_way">ذهاب فقط — فاوجر ١٠ دراهم</option><option value="round_trip">ذهاب وعودة — فاوجر ٢٥ درهمًا</option></select></label><label><input id="confirmed" type="checkbox">أؤكد إتمام الحجز وإصدار تذكرة فلاي شام</label><button id="issue">إصدار الفاوجر</button></section><section><h2>صورة الفاوجر وإرسالها</h2><label>مرجع الفاوجر <input id="voucherId"></label><button id="preview">عرض الصورة</button><a id="download" hidden download="remal-voucher.png">تنزيل الصورة</a><div><img id="image" hidden alt="فاوجر مجموعة الرمال"></div><label>رقم واتساب العميل مع رمز الدولة دون + <input id="recipient" inputmode="numeric"></label><label><input id="confirmRecipient" type="checkbox">راجعت رقم العميل وهو صاحب الفاوجر</label><button id="send">إرسال الصورة عبر واتساب</button><small>الإرسال الناجح إلى ميتا لا يؤكد وصول الصورة إلى هاتف العميل.</small></section><section><h2>استخدام أو إلغاء الفاوجر</h2><label>مرجع الخدمة الجديدة <input id="serviceRef" maxlength="100"></label><label><input id="redeemConfirmed" type="checkbox">أؤكد تطبيق قيمة الفاوجر على الخدمة الجديدة</label><button id="redeem">تأكيد الاستخدام لمرة واحدة</button><label><input id="cancelConfirmed" type="checkbox">أؤكد إلغاء هذا الفاوجر</label><button id="cancel" class="danger">إلغاء الفاوجر</button><small>مسح QR للتحقق لا يغير حالة الفاوجر.</small></section><script src="/vouchers-admin.js" defer></script></html>
