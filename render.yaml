services:
  - type: web
    name: flycham-whatsapp-assistant
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DRY_RUN
        value: "true"
      - key: AIR_ARABIA_MARGIN_AED
        value: "25"
      - key: AIR_ARABIA_SEAT_MARGIN_AED
        value: "10"
      - key: AIR_ARABIA_MEAL_MARGIN_AED
        value: "5"
      - key: PORT
        value: "3000"
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_GRAPH_API_VERSION
        value: v23.0

  # Proposed always-on browser worker; not deployed by this draft.
  - type: worker
    name: airarabia-portal-keepalive
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 30
    envVars:
      - key: AIR_ARABIA_KEEPALIVE_ENABLED
        value: "false"
      - key: AIR_ARABIA_KEEPALIVE_ORIGIN
        value: SHJ
      - key: AIR_ARABIA_KEEPALIVE_DESTINATION
        value: DAM
      - key: AIR_ARABIA_AGENT_USERNAME
        sync: false
      - key: AIR_ARABIA_AGENT_PASSWORD
        sync: false
