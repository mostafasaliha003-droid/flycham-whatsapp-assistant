name: Raad isolated container build

# A dedicated build-only branch; no Render-tracked branch or deployment action.
'on':
  push:
    branches:
      - 'build-validation/raad-readiness-20261031'

permissions:
  contents: read

concurrency:
  group: raad-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-container:
    if: github.repository == 'mostafasaliha003-droid/flycham-whatsapp-assistant' && github.ref == 'refs/heads/build-validation/raad-readiness-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-31
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Select the tested Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, resolved 2026-10-31
        with:
          node-version: '24.22.1'
          check-latest: false

      - name: Verify runner capability and exact input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node -e 'const [major,minor]=process.versions.node.split(".").map(Number); if(major<22 || (major===22 && minor<13)) process.exit(1)'
          docker version
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path(os.environ['GITHUB_WORKSPACE'])
          output = Path(os.environ['RUNNER_TEMP']) / 'raad-container-input.json'
          names = ['Dockerfile.worker', '.dockerignore', 'package.json', 'package-lock.json', 'scripts/install-mrz-model.js', 'THIRD_PARTY_MRZ_MODEL.md']
          output.write_text(json.dumps({'commit': os.environ['GITHUB_SHA'], 'files': {name: hashlib.sha256((root/name).read_bytes()).hexdigest() for name in names}}, indent=2)+'\n')
          PY

      - name: Fresh install, image preflight and complete fenced unit suite
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/raad-readiness/run-ci.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/raad-readiness"

      - name: Upload complete build evidence only
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, resolved 2026-10-31
        with:
          name: raad-container-${{ github.sha }}-attempt-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/raad-container-input.json
            ${{ runner.temp }}/raad-readiness/artifacts/**
